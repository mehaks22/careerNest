spring.application.name=backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MongoDB Atlas Configuration (Read from .env or deployment host)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=careernest

# JWT Configuration (Read from .env or deployment host)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.careernest=DEBUG

# Security (Disable default Spring Security auto-generated password)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration